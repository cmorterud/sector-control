name: Publish playable Pages previews

on:
  workflow_run:
    workflows: ["Build, test, render and publish"]
    types: [completed]
  # Only the trusted base-branch workflow runs for cleanup. Never check out PR code here.
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful CI run to publish again (empty to prune closed previews)
        type: string

permissions:
  contents: read

env:
  PAGES_SITE_URL: https://codymorterud.com/sector-control/

jobs:
  publish:
    # Skip without taking a runner or the publication queue when:
    # - CI was cancelled: a newer push superseded it, and that run publishes;
    # - a PR was merged: main's own publication prunes its preview.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      !(github.event_name == 'pull_request_target' && github.event.pull_request.merged)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Serialize snapshot writes and deployment, then release the queue while
    # read-only verifiers check their individual revisions.
    concurrency:
      group: pages-publication
      queue: max
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
      statuses: write
      pull-requests: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url || steps.deploy_final.outputs.page_url }}
    outputs:
      publish: ${{ steps.context.outputs.publish }}
      pr: ${{ steps.context.outputs.pr }}
      head: ${{ steps.context.outputs.head }}
      run: ${{ steps.context.outputs.run }}
      attempt: ${{ steps.context.outputs.attempt }}
      url: ${{ steps.context.outputs.url }}
      reason: ${{ steps.context.outputs.reason }}
      cleanup: ${{ steps.context.outputs.cleanup }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - name: Validate CI provenance and current PR revision
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/pages-preview.mjs resolve
      - name: Download static files from the validated CI run
        if: steps.context.outputs.publish == 'true' && steps.context.outputs.run != ''
        uses: actions/download-artifact@v8
        with:
          name: production-build
          path: playtest-artifacts/pages-incoming
          run-id: ${{ steps.context.outputs.run }}
          github-token: ${{ github.token }}
      - name: Preserve production and other previews; prune closed PRs
        if: steps.context.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/pages-preview.mjs stage
      - name: Upload complete Pages site
        if: steps.context.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          # One name per attempt. A re-run would otherwise add a second
          # "github-pages" artifact to this run, which the deployment refuses.
          name: github-pages-${{ github.run_attempt }}
          path: playtest-artifacts/pages-site
      - uses: actions/configure-pages@v6
        if: steps.context.outputs.publish == 'true'
      # deploy-pages looks the artifact up once, in the Actions results
      # service, whose listing lags a finished upload by a few seconds. About
      # half of all deployments failed there. The public REST listing is a
      # different service and can show the artifact while the lookup still
      # misses it, so the only reliable check is the deployment itself: pause
      # briefly, then retry it up to twice with longer pauses.
      - name: Let the artifact listing settle
        if: steps.context.outputs.publish == 'true'
        run: sleep 5
      - uses: actions/deploy-pages@v5
        if: steps.context.outputs.publish == 'true'
        id: deploy
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before retrying the deployment
        if: steps.context.outputs.publish == 'true' && steps.deploy.outcome == 'failure'
        run: sleep 20
      - uses: actions/deploy-pages@v5
        if: steps.context.outputs.publish == 'true' && steps.deploy.outcome == 'failure'
        id: deploy_retry
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before the final deployment attempt
        if: steps.context.outputs.publish == 'true' && steps.deploy_retry.outcome == 'failure'
        run: sleep 40
      - uses: actions/deploy-pages@v5
        if: steps.context.outputs.publish == 'true' && steps.deploy_retry.outcome == 'failure'
        id: deploy_final
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  # One job, so a preview waits for one free runner instead of four. CI has
  # already played every map on these exact bytes (verify checks each asset
  # hash), so the deployed browser check covers hosting: the base path, MIME
  # types, caching and a real match, using Industrial's combat checks.
  verify:
    needs: publish
    if: needs.publish.result == 'success' && needs.publish.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - name: Verify published revision and every asset
        if: needs.publish.outputs.cleanup != 'true'
        env:
          REVIEW_BASE_URL: ${{ needs.publish.outputs.url }}
          EXPECTED_HEAD_SHA: ${{ needs.publish.outputs.head }}
          EXPECTED_PR_NUMBER: ${{ needs.publish.outputs.pr }}
          EXPECTED_CI_RUN: ${{ needs.publish.outputs.run }}
          EXPECTED_CI_ATTEMPT: ${{ needs.publish.outputs.attempt }}
        run: node tools/pages-preview.mjs verify
      - name: Verify closed preview is gone and production remains available
        if: needs.publish.outputs.cleanup == 'true'
        env:
          REVIEW_BASE_URL: ${{ needs.publish.outputs.url }}
          EXPECTED_PR_NUMBER: ${{ needs.publish.outputs.pr }}
        run: node tools/pages-preview.mjs verify-cleanup
      # Deployed PR JavaScript runs only on this read-only, secret-free runner.
      - name: Play the deployed build in Chrome
        if: needs.publish.outputs.cleanup != 'true'
        env:
          REVIEW_BASE_URL: ${{ needs.publish.outputs.url }}
          EXPECTED_HEAD_SHA: ${{ needs.publish.outputs.head }}
          EXPECTED_CI_RUN: ${{ needs.publish.outputs.run }}
          EXPECTED_CI_ATTEMPT: ${{ needs.publish.outputs.attempt }}
        run: node tools/render-review.mjs industrial dist playtest-artifacts/deployed-browser
      - uses: actions/upload-artifact@v7
        if: always() && needs.publish.outputs.cleanup != 'true'
        with:
          name: deployed-browser
          path: playtest-artifacts/deployed-browser/
          if-no-files-found: ignore
          retention-days: 14

  report:
    needs: [publish, verify]
    if: always() && needs.publish.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Keep the final status write atomic with respect to newer deployments.
    concurrency:
      group: pages-publication
      queue: max
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - name: Update preview link and required preview-ready status
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ needs.publish.outputs.pr }}
          PREVIEW_HEAD: ${{ needs.publish.outputs.head }}
          PREVIEW_URL: ${{ needs.publish.outputs.url }}
          PREVIEW_REASON: ${{ needs.publish.outputs.reason }}
          PREVIEW_CLEANUP: ${{ needs.publish.outputs.cleanup }}
          PREVIEW_STAGED: ${{ needs.publish.result == 'success' && needs.publish.outputs.publish == 'true' }}
          EXPECTED_CI_RUN: ${{ needs.publish.outputs.run }}
          EXPECTED_CI_ATTEMPT: ${{ needs.publish.outputs.attempt }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          VERIFY_RESULT: ${{ needs.verify.result == 'success' && 'success' || 'failure' }}
        run: node tools/pages-preview.mjs report
