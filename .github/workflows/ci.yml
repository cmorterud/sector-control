name: Build, test, render and publish

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  PAGES_BASE_PATH: /${{ github.event.repository.name }}/${{ github.event_name == 'pull_request' && format('pr-preview/pr-{0}/', github.event.pull_request.number) || '' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and test
        run: npm run check -- --maxWorkers=1

      - name: Test Pages publication and preview isolation
        run: npm run test:pages

      - name: Build production game
        run: npm run build -- --base "$PAGES_BASE_PATH"

      - name: Record tested revision and asset hashes
        run: node tools/pages-preview.mjs stamp

      - name: Save production build for rendered review
        uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: dist
          retention-days: 7

  render:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Software rendering at High quality (ambient occlusion, shadow cascades)
    # takes up to about six minutes on the larger maps.
    timeout-minutes: ${{ (matrix.map == 'training' || matrix.map == 'village') && 13 || 9 }}
    strategy:
      fail-fast: false
      matrix:
        map: [industrial, trenches, verdun, village, headland, training]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
      - name: Download tested production build
        uses: actions/download-artifact@v8
        with:
          name: production-build
          path: dist
      - name: Install locked tools for the Armoury check
        if: matrix.map == 'industrial'
        run: npm ci
      - name: Prepare gameplay stats for the Armoury check
        if: matrix.map == 'industrial'
        run: |
          mkdir -p playtest-artifacts
          node_modules/.bin/esbuild tools/armoury-expectations.ts --bundle --platform=node --format=esm --outfile=playtest-artifacts/armoury-expectations.mjs
          node playtest-artifacts/armoury-expectations.mjs > playtest-artifacts/armoury-expectations.json
          echo 'REVIEW_ARMOURY_STATS=playtest-artifacts/armoury-expectations.json' >> "$GITHUB_ENV"
      - name: Render map and check browser errors
        run: node tools/render-review.mjs "${{ matrix.map }}"
      - name: Save screenshots and browser diagnostics
        id: screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render-${{ matrix.map }}
          path: playtest-artifacts/render-${{ matrix.map }}/
          retention-days: 14
          if-no-files-found: error
      - name: Link visual review
        if: always()
        env:
          MAP_NAME: ${{ matrix.map }}
          ARTIFACT_URL: ${{ steps.screenshots.outputs.artifact-url }}
        run: |
          node --input-type=module -e 'import {appendFileSync} from "node:fs"; appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### " + process.env.MAP_NAME + " rendered review\n\n[Download screenshots and diagnostics](" + process.env.ARTIFACT_URL + ")\n\nOverview before battle, overview during battle, first person and third person. Software rendering is not a hardware FPS benchmark.\n");'

  pr-ready:
    if: always()
    needs: [build-and-test, render]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every build and rendered check
        env:
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          RENDER_RESULT: ${{ needs.render.result }}
        run: test "$BUILD_RESULT" = success && test "$RENDER_RESULT" = success
