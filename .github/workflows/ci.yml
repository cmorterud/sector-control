name: Build, test, render and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A PR update replaces the previous run. Main and manual runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PAGES_BASE_PATH: /${{ github.event.repository.name }}/${{ github.event_name == 'pull_request' && format('pr-preview/pr-{0}/', github.event.pull_request.number) || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Pages publication and preview isolation
        run: npm run test:pages

      - name: Build production game
        env:
          # The corner version label: the PR's own head commit, not the merge commit.
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILD_PR: ${{ github.event.pull_request.number }}
        run: npm run build -- --base "$PAGES_BASE_PATH"

      - name: Record tested revision and asset hashes
        run: node tools/pages-preview.mjs stamp

      - name: Save production build for rendered review
        uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: dist
          retention-days: 7

  tests:
    name: Game tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Run simulation and regression tests
        env:
          SHARD: ${{ matrix.shard }}
        run: npm test -- --maxWorkers=1 --shard="$SHARD/3"

  render:
    name: render (${{ matrix.group }})
    needs: build
    runs-on: ubuntu-latest
    # Maps run in pairs to hold fewer runners at once: six jobs instead of
    # ten (Spring Offensive runs alone), each about ten minutes, balanced on hosted-runner render times
    # (Verdun about 9 min with its eleven detail views, Village 7.5, Zeppelin 6, Night raid, Lighthouse
    # point and Ypres under 6, Training 4, Fort Vaux 3.5, Industrial
    # 2). Each limit is the sum of the maps' own former limits.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: verdun, maps: verdun, timeout: 13}
          - {group: spring-offensive, maps: spring-offensive, timeout: 13}
          - {group: village-industrial, maps: village industrial, timeout: 22}
          - {group: zeppelin-fort-vaux, maps: zeppelin fort-vaux, timeout: 22}
          - {group: trenches-training, maps: trenches training, timeout: 22}
          - {group: night-raid-headland, maps: night-raid headland, timeout: 18}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
      - name: Download tested production build
        uses: actions/download-artifact@v8
        with:
          name: production-build
          path: dist
      - name: Install locked tools for the Armory check
        if: contains(matrix.maps, 'industrial')
        run: npm ci
      - name: Prepare gameplay stats for the Armory check
        if: contains(matrix.maps, 'industrial')
        run: |
          mkdir -p playtest-artifacts
          node_modules/.bin/esbuild tools/armory-expectations.ts --bundle --platform=node --format=esm --outfile=playtest-artifacts/armory-expectations.mjs
          node playtest-artifacts/armory-expectations.mjs > playtest-artifacts/armory-expectations.json
      # Every map runs even if an earlier one fails; the step fails if any did.
      # Only Industrial opens the Armory, so only its run gets the stats.
      - name: Render maps and check browser errors
        env:
          MAPS: ${{ matrix.maps }}
        run: |
          failed=""
          for map in $MAPS; do
            echo "::group::$map"
            stats=""
            if [ "$map" = industrial ]; then stats=playtest-artifacts/armory-expectations.json; fi
            REVIEW_ARMORY_STATS="$stats" node tools/render-review.mjs "$map" || failed="$failed $map"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::Rendered check failed:$failed"; exit 1; fi
      - name: Save screenshots and browser diagnostics
        id: screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render-${{ matrix.group }}
          path: playtest-artifacts/render-*/
          retention-days: 14
          if-no-files-found: error
      - name: Link visual review
        if: always()
        env:
          MAPS: ${{ matrix.maps }}
          ARTIFACT_URL: ${{ steps.screenshots.outputs.artifact-url }}
        run: |
          node --input-type=module -e 'import {appendFileSync} from "node:fs"; appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### " + process.env.MAPS + " rendered review\n\n[Download screenshots and diagnostics](" + process.env.ARTIFACT_URL + ")\n\nOverview before battle, overview during battle, first person and third person for each map. Software rendering is not a hardware FPS benchmark.\n");'

  pr-ready:
    if: always()
    needs: [build, tests, render]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require the build, every test shard and every rendered check
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          RENDER_RESULT: ${{ needs.render.result }}
        run: test "$BUILD_RESULT" = success && test "$TEST_RESULT" = success && test "$RENDER_RESULT" = success
